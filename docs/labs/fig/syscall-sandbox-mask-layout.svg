<svg xmlns="http://www.w3.org/2000/svg" width="980" height="780" viewBox="0 0 980 780" role="img" aria-label="Sandbox mask storage, bytes, and bit positions">
<rect width="980" height="780" fill="white"/>
<text x="30" y="46.0" font-family="monospace" font-size="26" fill="#243047">Where the sandbox mask lives</text>
<text x="30" y="76.0" font-family="monospace" font-size="16" fill="#243047">Kernel storage -&gt; selected member -&gt; bytes -&gt; bit positions</text>
<text x="30" y="119.0" font-family="monospace" font-size="19" fill="#243047">1. proc[NPROC] is a static table in kernel/proc.c.</text>
<rect x="30" y="140" width="170" height="55" fill="#f0ffff" stroke="#243047"/>
<text x="42" y="175.0" font-family="monospace" font-size="18" fill="#243047">proc[0]</text>
<rect x="200" y="140" width="100" height="55" fill="#ffffff" stroke="#243047"/>
<text x="212" y="175.0" font-family="monospace" font-size="18" fill="#243047">...</text>
<rect x="300" y="140" width="240" height="55" fill="#f0ffff" stroke="#243047"/>
<text x="312" y="175.0" font-family="monospace" font-size="18" fill="#243047">proc[i] (selected)</text>
<rect x="540" y="140" width="100" height="55" fill="#ffffff" stroke="#243047"/>
<text x="552" y="175.0" font-family="monospace" font-size="18" fill="#243047">...</text>
<rect x="640" y="140" width="300" height="55" fill="#f0ffff" stroke="#243047"/>
<text x="652" y="175.0" font-family="monospace" font-size="18" fill="#243047">proc[NPROC - 1]</text>
<text x="30" y="244.0" font-family="monospace" font-size="19" fill="#243047">2. A selected struct proc contains the mask member.</text>
<rect x="30" y="265" width="910" height="90" fill="#f0ffff" stroke="#243047"/>
<text x="50" y="297.0" font-family="monospace" font-size="17" fill="#243047">Other fields and padding omitted; no offsets implied.</text>
<text x="50" y="332.0" font-family="monospace" font-size="18" fill="#243047">mask: int (4 bytes), example value 32768 = 0x00008000</text>
<text x="30" y="404.0" font-family="monospace" font-size="19" fill="#243047">3. Byte view: addresses increase left to right (little-endian).</text>
<rect x="30.0" y="425" width="227.5" height="70" fill="#f0fff0" stroke="#243047"/>
<text x="42.0" y="448.0" font-family="monospace" font-size="16" fill="#243047">byte offset +0</text>
<text x="120.0" y="482.0" font-family="monospace" font-size="21" fill="#243047">00</text>
<rect x="257.5" y="425" width="227.5" height="70" fill="#f0fff0" stroke="#243047"/>
<text x="269.5" y="448.0" font-family="monospace" font-size="16" fill="#243047">byte offset +1</text>
<text x="347.5" y="482.0" font-family="monospace" font-size="21" fill="#243047">80</text>
<rect x="485.0" y="425" width="227.5" height="70" fill="#f0fff0" stroke="#243047"/>
<text x="497.0" y="448.0" font-family="monospace" font-size="16" fill="#243047">byte offset +2</text>
<text x="575.0" y="482.0" font-family="monospace" font-size="21" fill="#243047">00</text>
<rect x="712.5" y="425" width="227.5" height="70" fill="#f0fff0" stroke="#243047"/>
<text x="724.5" y="448.0" font-family="monospace" font-size="16" fill="#243047">byte offset +3</text>
<text x="802.5" y="482.0" font-family="monospace" font-size="21" fill="#243047">00</text>
<text x="30" y="544.0" font-family="monospace" font-size="19" fill="#243047">4. Bit view: positions decrease left to right (not addresses).</text>
<text x="33.0" y="577.0" font-family="monospace" font-size="12" fill="#243047">31</text>

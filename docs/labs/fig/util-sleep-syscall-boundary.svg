<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 690" width="1240" height="690" role="img" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Monaco, monospace"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect width="1240" height="690" fill="#ffffff"/><text x="40" y="54" font-size="28" font-weight="600" fill="#1e1e1e" xml:space="preserve">How sleep 10 reaches sys_pause()</text><text x="40" y="84" font-size="16" font-weight="400" fill="#868e96" xml:space="preserve">The user program chooses what to ask for; the kernel owns how the process waits without polling.</text><text x="40" y="132" font-size="14" font-weight="600" fill="#c66" xml:space="preserve">USER MODE: process runs sleep command</text><text x="650" y="132" font-size="14" font-weight="600" fill="#66c" xml:space="preserve">KERNEL MODE: one privileged kernel/kernel image</text><line x1="620" y1="108" x2="620" y2="448" stroke="#868e96" stroke-width="2" stroke-dasharray="8 8"/><rect x="40" y="155" width="250" height="250" rx="8" fill="#fff0f0" stroke="#c66" stroke-width="2"/><text x="58" y="191" font-size="16" font-weight="600" fill="#c66" xml:space="preserve">1  USER PROGRAM</text><text x="58" y="233" font-size="18" font-weight="600" fill="#1e1e1e" xml:space="preserve">user/sleep.c</text><text x="58" y="269" font-size="14" font-weight="400" fill="#495057" xml:space="preserve">checks command text</text><text x="58" y="309" font-size="14" font-weight="400" fill="#495057" xml:space="preserve">converts ticks to n</text><text x="58" y="349" font-size="14" font-weight="400" fill="#495057" xml:space="preserve">calls pause(n)</text><rect x="330" y="155" width="250" height="250" rx="8" fill="#fff0f0" stroke="#c66" stroke-width="2"/><text x="348" y="191" font-size="16" font-weight="600" fill="#c66" xml:space="preserve">2  GENERATED STUB</text><text x="348" y="233" font-size="18" font-weight="600" fill="#1e1e1e" xml:space="preserve">user/usys.S</text><text x="348" y="269" font-size="14" font-weight="400" fill="#495057" xml:space="preserve">a0 = n (argument 0)</text><text x="348" y="309" font-size="14" font-weight="400" fill="#495057" xml:space="preserve">a7 = SYS_pause (call number)</text><text x="348" y="349" font-size="14" font-weight="400" fill="#495057" xml:space="preserve">ecall crosses the boundary</text><rect x="660" y="155" width="250" height="250" rx="8" fill="#f0f0ff" stroke="#66c" stroke-width="2"/><text x="678" y="191" font-size="16" font-weight="600" fill="#66c" xml:space="preserve">3  KERNEL ROUTING</text><text x="678" y="233" font-size="18" font-weight="600" fill="#1e1e1e" xml:space="preserve">saved trapframe</text><text x="678" y="269" font-size="14" font-weight="400" fill="#495057" xml:space="preserve">holds user registers</text><text x="678" y="309" font-size="14" font-weight="400" fill="#495057" xml:space="preserve">kernel/syscall.c reads a7</text><text x="678" y="349" font-size="14" font-weight="400" fill="#495057" xml:space="preserve">dispatches sys_pause(void)</text><rect x="950" y="155" width="250" height="250" rx="8" fill="#fffff0" stroke="#cc6" stroke-width="2"/><text x="968" y="191" font-size="16" font-weight="600" fill="#8a7b00" xml:space="preserve">4  KERNEL HANDLER</text><text x="968" y="233" font-size="18" font-weight="600" fill="#1e1e1e" xml:space="preserve">kernel/sysproc.c</text><text x="968" y="269" font-size="14" font-weight="400" fill="#495057" xml:space="preserve">argint(0, &amp;n) reads a0</text><text x="968" y="309" font-size="14" font-weight="400" fill="#495057" xml:space="preserve">snapshots ticks and waits</text><text x="968" y="349" font-size="14" font-weight="400" fill="#495057" xml:space="preserve">returns 0 through a0</text><line x1="292" y1="280" x2="322" y2="280" stroke="#c66" stroke-width="2" marker-end="url(#arrow)"/><line x1="582" y1="280" x2="652" y2="280" stroke="#66c" stroke-width="2" marker-end="url(#arrow)"/><line x1="912" y1="280" x2="942" y2="280" stroke="#8a7b00" stroke-width="2" marker-end="url(#arrow)"/><text x="294" y="257" font-size="12" font-weight="400" fill="#868e96" xml:space="preserve">C call</text><text x="590" y="257" font-size="12" font-weight="400" fill="#868e96" xml:space="preserve">ecall / trap</text><text x="914" y="257" font-size="12" font-weight="400" fill="#868e96" xml:space="preserve">dispatch</text><rect x="40" y="445" width="1160" height="62" rx="8" fill="#f0ffff" stroke="#6cc" stroke-width="2"/><text x="60" y="472" font-size="14" font-weight="600" fill="#268c8c" xml:space="preserve">RETURN PATH</text><text x="180" y="473" font-size="15" font-weight="400" fill="#495057" xml:space="preserve">syscall.c stores the handler result in saved a0; the process resumes in user mode.</text><line x1="1110" y1="432" x2="260" y2="432" stroke="#268c8c" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="545" width="560" height="105" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text x="60" y="574" font-size="14" font-weight="600" fill="#495057" xml:space="preserve">SOURCE FILE != PROGRAM</text><text x="60" y="606" font-size="14" font-weight="400" fill="#868e96" xml:space="preserve">user/ also contains libraries; UPROGS selects commands.</text><rect x="640" y="545" width="560" height="105" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text x="660" y="574" font-size="14" font-weight="600" fill="#495057" xml:space="preserve">PROCESS != KERNEL FILE</text><text x="660" y="606" font-size="14" font-weight="400" fill="#868e96" xml:space="preserve">One process crosses modes; sysproc.c is linked into the kernel.</text></svg>

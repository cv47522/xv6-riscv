<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 1300" width="1360" height="1300" role="img" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Monaco, monospace"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect width="1360" height="1300" fill="#ffffff"/><text x="40" y="52" font-size="26" font-weight="600" fill="#1e1e1e" xml:space="preserve">How sleep 10 reaches sys_pause() and comes back</text><text x="40" y="81" font-size="15" font-weight="400" fill="#868e96" xml:space="preserve">A C call stays in user mode; only ecall enters the kernel, and only sret leaves it.</text><text x="40" y="124" font-size="14" font-weight="600" fill="#c66" xml:space="preserve">USER MODE (U-mode): unprivileged</text><text x="540" y="124" font-size="14" font-weight="600" fill="#66c" xml:space="preserve">KERNEL MODE (S-mode): kernel/kernel</text><text x="1020" y="124" font-size="14" font-weight="600" fill="#2f8a2f" xml:space="preserve">PER-PROCESS SAVED STATE</text><line x1="480" y1="100" x2="480" y2="1100" stroke="#868e96" stroke-width="2" stroke-dasharray="8 8"/><rect x="40" y="140" width="380" height="135" rx="8" fill="#fff0f0" stroke="#c66" stroke-width="2"/><text x="58" y="169" font-size="15" font-weight="600" fill="#c66" xml:space="preserve">1  USER PROGRAM</text><text x="58" y="191" font-size="15" font-weight="600" fill="#1e1e1e" xml:space="preserve">user/sleep.c</text><text x="58" y="217" font-size="13" font-weight="400" fill="#495057" xml:space="preserve">argv[1] "10" -&gt; atoi() -&gt; n</text><text x="58" y="238" font-size="13" font-weight="400" fill="#495057" xml:space="preserve">pause(n): ordinary C call (jal)</text><text x="58" y="259" font-size="13" font-weight="400" fill="#495057" xml:space="preserve">a0 = n by the RISC-V calling convention</text><rect x="40" y="325" width="380" height="135" rx="8" fill="#f0f0ff" stroke="#66c" stroke-width="2"/><text x="58" y="354" font-size="15" font-weight="600" fill="#66c" xml:space="preserve">2  SYSCALL STUB</text><text x="58" y="376" font-size="15" font-weight="600" fill="#1e1e1e" xml:space="preserve">user/usys.S</text><text x="58" y="402" font-size="13" font-weight="400" fill="#495057" xml:space="preserve">generated from user/usys.pl</text><text x="58" y="423" font-size="13" font-weight="400" fill="#495057" xml:space="preserve">li a7, SYS_pause   # 13</text><text x="58" y="444" font-size="13" font-weight="400" fill="#495057" xml:space="preserve">ecall              # a0 left alone</text><line x1="230" y1="277" x2="230" y2="319" stroke="#c66" stroke-width="2" marker-end="url(#arrow)"/><text x="242" y="299" font-size="12" font-weight="400" fill="#868e96" xml:space="preserve">C call: same mode, same stack</text><rect x="540" y="325" width="420" height="156" rx="8" fill="#f0f0ff" stroke="#66c" stroke-width="2"/><text x="558" y="354" font-size="15" font-weight="600" fill="#66c" xml:space="preserve">3  TRAP ENTRY</text><text x="558" y="376" font-size="15" font-weight="600" fill="#1e1e1e" xml:space="preserve">kernel/trampoline.S  uservec</text><text x="558" y="402" font-size="13" font-weight="400" fill="#495057" xml:space="preserve">stvec points here (trampoline page)</text><text x="558" y="423" font-size="13" font-weight="400" fill="#495057" xml:space="preserve">save 31 user registers -&gt; TRAPFRAME</text><text x="558" y="444" font-size="13" font-weight="400" fill="#495057" xml:space="preserve">load kernel sp, satp, hartid into tp</text><text x="558" y="465" font-size="13" font-weight="400" fill="#495057" xml:space="preserve">jalr t0  -&gt; usertrap()</text><rect x="540" y="509" width="420" height="135" rx="8" fill="#f0f0ff" stroke="#66c" stroke-width="2"/><text x="558" y="538" font-size="15" font-weight="600" fill="#66c" xml:space="preserve">4  CLASSIFY</text><text x="558" y="560" font-size="15" font-weight="600" fill="#1e1e1e" xml:space="preserve">kernel/trap.c  usertrap()</text><text x="558" y="586" font-size="13" font-weight="400" fill="#495057" xml:space="preserve">scause == 8: system call from U-mode</text><text x="558" y="607" font-size="13" font-weight="400" fill="#495057" xml:space="preserve">trapframe-&gt;epc += 4  (skip the ecall)</text><text x="558" y="628" font-size="13" font-weight="400" fill="#495057" xml:space="preserve">intr_on(); syscall()</text><line x1="750" y1="483" x2="750" y2="503" stroke="#66c" stroke-width="2" marker-end="url(#arrow)"/><rect x="540" y="672" width="420" height="114" rx="8" fill="#f0f0ff" stroke="#66c" stroke-width="2"/><text x="558" y="701" font-size="15" font-weight="600" fill="#66c" xml:space="preserve">5  DISPATCH</text><text x="558" y="723" font-size="15" font-weight="600" fill="#1e1e1e" xml:space="preserve">kernel/syscall.c  syscall()</text><text x="558" y="749" font-size="13" font-weight="400" fill="#495057" xml:space="preserve">num = trapframe-&gt;a7         # 13</text><text x="558" y="770" font-size="13" font-weight="400" fill="#495057" xml:space="preserve">trapframe-&gt;a0 = syscalls[num]()</text><line x1="750" y1="646" x2="750" y2="666" stroke="#66c" stroke-width="2" marker-end="url(#arrow)"/><rect x="540" y="814" width="420" height="135" rx="8" fill="#fffff0" stroke="#cc6" stroke-width="2"/><text x="558" y="843" font-size="15" font-weight="600" fill="#8a7b00" xml:space="preserve">6  HANDLER</text><text x="558" y="865" font-size="15" font-weight="600" fill="#1e1e1e" xml:space="preserve">kernel/sysproc.c  sys_pause(void)</text><text x="558" y="891" font-size="13" font-weight="400" fill="#495057" xml:space="preserve">argint(0, &amp;n): trapframe-&gt;a0  # 10</text><text x="558" y="912" font-size="13" font-weight="400" fill="#495057" xml:space="preserve">sleep on &amp;ticks until n ticks pass</text><text x="558" y="933" font-size="13" font-weight="400" fill="#495057" xml:space="preserve">return 0, or -1 if killed while waiting</text><line x1="750" y1="788" x2="750" y2="808" stroke="#8a7b00" stroke-width="2" marker-end="url(#arrow)"/><rect x="540" y="977" width="420" height="135" rx="8" fill="#f0ffff" stroke="#6cc" stroke-width="2"/><text x="558" y="1006" font-size="15" font-weight="600" fill="#268c8c" xml:space="preserve">7  RETURN</text><text x="558" y="1028" font-size="15" font-weight="600" fill="#1e1e1e" xml:space="preserve">kernel/trap.c + trampoline.S</text><text x="558" y="1054" font-size="13" font-weight="400" fill="#495057" xml:space="preserve">prepare_return(): sepc = trapframe-&gt;epc</text><text x="558" y="1075" font-size="13" font-weight="400" fill="#495057" xml:space="preserve">userret: restore registers from TRAPFRAME</text><text x="558" y="1096" font-size="13" font-weight="400" fill="#495057" xml:space="preserve">sret: S-mode -&gt; U-mode at sepc</text><line x1="750" y1="951" x2="750" y2="971" stroke="#268c8c" stroke-width="2" marker-end="url(#arrow)"/><line x1="422" y1="425" x2="534" y2="425" stroke="#66c" stroke-width="2" marker-end="url(#arrow)"/><rect x="426" y="369" width="104" height="46" fill="#ffffff"/><rect x="426" y="431" width="104" height="40" fill="#ffffff"/><text x="430" y="386" font-size="13" font-weight="600" fill="#66c" xml:space="preserve">ecall</text><text x="430" y="407" font-size="12" font-weight="400" fill="#868e96" xml:space="preserve">U -&gt; S mode</text><text x="430" y="445" font-size="12" font-weight="400" fill="#868e96" xml:space="preserve">scause = 8</text><text x="430" y="463" font-size="12" font-weight="400" fill="#868e96" xml:space="preserve">sepc = pc</text><rect x="40" y="500" width="380" height="190" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text x="58" y="528" font-size="14" font-weight="600" fill="#495057" xml:space="preserve">REGISTER ROLES AT THE ecall</text><text x="58" y="559" font-size="13" font-weight="400" fill="#495057" xml:space="preserve">a0..a5  args 0..5   argraw(n) in syscall.c</text><text x="58" y="579" font-size="13" font-weight="400" fill="#495057" xml:space="preserve">a6      unused by any xv6 call</text><text x="58" y="599" font-size="13" font-weight="400" fill="#495057" xml:space="preserve">a7      call number  syscall() indexes</text><text x="58" y="619" font-size="13" font-weight="400" fill="#495057" xml:space="preserve">a0      result       written back on return</text><text x="58" y="659" font-size="13" font-weight="400" fill="#495057" xml:space="preserve">C caller already placed a0; the stub</text><text x="58" y="679" font-size="13" font-weight="400" fill="#495057" xml:space="preserve">only adds a7, so it needs no mv.</text><rect x="40" y="977" width="380" height="135" rx="8" fill="#f0ffff" stroke="#6cc" stroke-width="2"/><text x="58" y="1006" font-size="15" font-weight="600" fill="#268c8c" xml:space="preserve">8  BACK IN USER MODE</text><text x="58" y="1028" font-size="15" font-weight="600" fill="#1e1e1e" xml:space="preserve">user/usys.S -&gt; sleep.c</text><text x="58" y="1054" font-size="13" font-weight="400" fill="#495057" xml:space="preserve">pc = instruction after ecall</text><text x="58" y="1075" font-size="13" font-weight="400" fill="#495057" xml:space="preserve">stub executes ret</text><text x="58" y="1096" font-size="13" font-weight="400" fill="#495057" xml:space="preserve">pause() returns a0 = 0 to main()</text><line x1="538" y1="1044" x2="426" y2="1044" stroke="#268c8c" stroke-width="2" marker-end="url(#arrow)"/><rect x="426" y="1010" width="104" height="30" fill="#ffffff"/><rect x="426" y="1050" width="104" height="40" fill="#ffffff"/><text x="430" y="1027" font-size="13" font-weight="600" fill="#268c8c" xml:space="preserve">sret</text><text x="430" y="1064" font-size="12" font-weight="400" fill="#868e96" xml:space="preserve">S -&gt; U mode</text><text x="430" y="1082" font-size="12" font-weight="400" fill="#868e96" xml:space="preserve">pc = sepc</text><rect x="1020" y="325" width="300" height="787" rx="8" fill="#f0fff0" stroke="#6c6" stroke-width="2"/><text x="1038" y="354" font-size="15" font-weight="600" fill="#2f8a2f" xml:space="preserve">TRAPFRAME PAGE</text><text x="1038" y="380" font-size="15" font-weight="600" fill="#1e1e1e" xml:space="preserve">p-&gt;trapframe</text><text x="1038" y="402" font-size="13" font-weight="400" fill="#495057" xml:space="preserve">struct trapframe, kernel/proc.h</text><text x="1038" y="423" font-size="13" font-weight="400" fill="#495057" xml:space="preserve">one 4096-byte page per process</text><text x="1038" y="444" font-size="13" font-weight="400" fill="#495057" xml:space="preserve">mapped at TRAPFRAME without PTE_U</text><text x="1038" y="486" font-size="13" font-weight="600" fill="#1e1e1e" xml:space="preserve">off  field        this call</text><text x="1038" y="507" font-size="13" font-weight="400" fill="#495057" xml:space="preserve">  0  kernel_satp  kernel pgtbl</text><text x="1038" y="528" font-size="13" font-weight="400" fill="#495057" xml:space="preserve">  8  kernel_sp    kstack top</text><text x="1038" y="549" font-size="13" font-weight="400" fill="#495057" xml:space="preserve"> 16  kernel_trap  usertrap</text><text x="1038" y="570" font-size="13" font-weight="400" fill="#495057" xml:space="preserve"> 24  epc          ecall pc, +4</text><text x="1038" y="591" font-size="13" font-weight="400" fill="#495057" xml:space="preserve"> 32  kernel_hartid  for tp</text><text x="1038" y="612" font-size="13" font-weight="600" fill="#1e1e1e" xml:space="preserve">112  a0           10 in, 0 out</text><text x="1038" y="633" font-size="13" font-weight="600" fill="#1e1e1e" xml:space="preserve">168  a7           13 SYS_pause</text><text x="1038" y="654" font-size="13" font-weight="400" fill="#495057" xml:space="preserve"> ..  29 other user registers</text><text x="1038" y="696" font-size="13" font-weight="400" fill="#495057" xml:space="preserve">argraw(0..5) reads a0..a5;</text><text x="1038" y="717" font-size="13" font-weight="400" fill="#495057" xml:space="preserve">a6 unused; a7 picks the call.</text><text x="1038" y="738" font-size="13" font-weight="400" fill="#495057" xml:space="preserve">Each process owns its own page,</text><text x="1038" y="759" font-size="13" font-weight="400" fill="#495057" xml:space="preserve">so a sleeping process keeps</text><text x="1038" y="780" font-size="13" font-weight="400" fill="#495057" xml:space="preserve">its saved registers here.</text><line x1="962" y1="403" x2="1014" y2="403" stroke="#2f8a2f" stroke-width="2" stroke-dasharray="8 8" marker-end="url(#arrow)"/><text x="964" y="395" font-size="12" font-weight="400" fill="#2f8a2f" xml:space="preserve">save</text><line x1="962" y1="729" x2="1014" y2="729" stroke="#2f8a2f" stroke-width="2" stroke-dasharray="8 8" marker-end="url(#arrow)"/><text x="964" y="721" font-size="12" font-weight="400" fill="#2f8a2f" xml:space="preserve">a7, a0</text><line x1="962" y1="881" x2="1014" y2="881" stroke="#2f8a2f" stroke-width="2" stroke-dasharray="8 8" marker-end="url(#arrow)"/><text x="964" y="873" font-size="12" font-weight="400" fill="#2f8a2f" xml:space="preserve">a0</text><line x1="962" y1="1044" x2="1014" y2="1044" stroke="#2f8a2f" stroke-width="2" stroke-dasharray="8 8" marker-end="url(#arrow)"/><text x="964" y="1036" font-size="12" font-weight="400" fill="#2f8a2f" xml:space="preserve">restore</text><rect x="40" y="1130" width="760" height="150" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text x="60" y="1160" font-size="14" font-weight="600" fill="#495057" xml:space="preserve">THREE CONTROL TRANSFERS</text><text x="60" y="1192" font-size="14" font-weight="400" fill="#868e96" xml:space="preserve">C call  jal/ret   stays in U-mode; same stack; no kernel</text><text x="60" y="1216" font-size="14" font-weight="400" fill="#868e96" xml:space="preserve">ecall   trap in   hardware: U-&gt;S, sepc=pc, scause=8, pc=stvec</text><text x="60" y="1240" font-size="14" font-weight="400" fill="#868e96" xml:space="preserve">sret    trap out  hardware: S-&gt;U, pc=sepc; the only way back</text><text x="60" y="1264" font-size="14" font-weight="400" fill="#868e96" xml:space="preserve">Same registers, different roles: a0 = arg 0 then result</text><rect x="840" y="1130" width="480" height="150" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text x="860" y="1160" font-size="14" font-weight="600" fill="#495057" xml:space="preserve">FILE != PROGRAM != PROCESS</text><text x="860" y="1192" font-size="14" font-weight="400" fill="#868e96" xml:space="preserve">UPROGS turns user/sleep.c into a command;</text><text x="860" y="1216" font-size="14" font-weight="400" fill="#868e96" xml:space="preserve">ulib.c, printf.c, umalloc.c are libraries.</text><text x="860" y="1240" font-size="14" font-weight="400" fill="#868e96" xml:space="preserve">sysproc.c is linked into kernel/kernel;</text><text x="860" y="1264" font-size="14" font-weight="400" fill="#868e96" xml:space="preserve">one process runs in both modes.</text></svg>
<text x="40" y="663.3" font-family="Cascadia Code, Consolas, monospace" font-size="14" fill="#1e1e1e" xml:space="preserve">Legend: yellow = one stack frame per active find() call;  green = bytes the</text>
<text x="40" y="680.8" font-family="Cascadia Code, Consolas, monospace" font-size="14" fill="#1e1e1e" xml:space="preserve">current child's name occupies (rewritten for every record);  cyan = an fd</text>
<text x="40" y="698.3" font-family="Cascadia Code, Consolas, monospace" font-size="14" fill="#1e1e1e" xml:space="preserve">held across nested calls;  red dashed = an fd that exists only inside stat().</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 690" width="1240" height="690" role="img" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Monaco, monospace"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect width="1240" height="690" fill="#ffffff"/><text x="40" y="54" font-size="28" font-weight="600" fill="#1e1e1e" xml:space="preserve">What sys_pause() is waiting for</text><text x="40" y="84" font-size="16" font-weight="400" fill="#868e96" xml:space="preserve">One global counter advances on timer interrupts; each waiting process remembers its own starting value.</text><rect x="40" y="125" width="315" height="240" rx="8" fill="#f0f0ff" stroke="#66c" stroke-width="2"/><text x="60" y="161" font-size="16" font-weight="600" fill="#66c" xml:space="preserve">CLOCK SOURCE</text><text x="60" y="201" font-size="16" font-weight="600" fill="#1e1e1e" xml:space="preserve">kernel/trap.c defines ticks</text><text x="60" y="239" font-size="14" font-weight="400" fill="#495057" xml:space="preserve">hart 0: timer interrupt</text><text x="60" y="283" font-size="18" font-weight="400" fill="#1e1e1e" xml:space="preserve">ticks++</text><text x="60" y="319" font-size="14" font-weight="400" fill="#495057" xml:space="preserve">wakeup(&amp;ticks)</text><rect x="425" y="125" width="430" height="330" rx="8" fill="#fffff0" stroke="#cc6" stroke-width="2"/><text x="445" y="161" font-size="16" font-weight="600" fill="#8a7b00" xml:space="preserve">ONE PROCESS IN sys_pause()</text><text x="445" y="208" font-size="15" font-weight="400" fill="#495057" xml:space="preserve">1  n = argument 0</text><text x="445" y="256" font-size="15" font-weight="400" fill="#495057" xml:space="preserve">2  ticks0 = ticks</text><text x="445" y="306" font-size="17" font-weight="400" fill="#1e1e1e" xml:space="preserve">3  ticks - ticks0 &lt; n ?</text><rect x="445" y="335" width="390" height="75" rx="8" fill="#ffd9d9" stroke="#c44" stroke-width="2"/><text x="465" y="362" font-size="15" font-weight="600" fill="#9c2c2c" xml:space="preserve">YES: register &amp;ticks and sleep</text><text x="465" y="389" font-size="14" font-weight="400" fill="#495057" xml:space="preserve">wake, reacquire, and recheck</text><rect x="925" y="125" width="275" height="120" rx="8" fill="#f0ffff" stroke="#6cc" stroke-width="2"/><text x="945" y="160" font-size="15" font-weight="600" fill="#268c8c" xml:space="preserve">NO: enough ticks elapsed</text><text x="945" y="201" font-size="18" font-weight="600" fill="#1e1e1e" xml:space="preserve">return 0</text><rect x="925" y="285" width="275" height="120" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text x="945" y="319" font-size="14" font-weight="600" fill="#495057" xml:space="preserve">AT EACH RECHECK</text><text x="945" y="352" font-size="14" font-weight="400" fill="#868e96" xml:space="preserve">killed process: return -1</text><line x1="357" y1="245" x2="437" y2="355" stroke="#66c" stroke-width="2" marker-end="url(#arrow)"/><text x="365" y="290" font-size="12" font-weight="400" fill="#868e96" xml:space="preserve">timer tick wakes waiters</text><line x1="857" y1="270" x2="917" y2="200" stroke="#268c8c" stroke-width="2" marker-end="url(#arrow)"/><text x="865" y="237" font-size="12" font-weight="400" fill="#868e96" xml:space="preserve">condition false</text><line x1="857" y1="305" x2="917" y2="340" stroke="#868e96" stroke-width="2" marker-end="url(#arrow)"/><text x="868" y="332" font-size="12" font-weight="400" fill="#868e96" xml:space="preserve">killed</text><rect x="40" y="425" width="315" height="180" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text x="60" y="459" font-size="14" font-weight="600" fill="#495057" xml:space="preserve">HART != PROCESS</text><text x="60" y="487" font-size="13" font-weight="400" fill="#868e96" xml:space="preserve">hart: hardware execution context</text><text x="60" y="516" font-size="13" font-weight="400" fill="#868e96" xml:space="preserve">process: running user program</text><text x="60" y="545" font-size="13" font-weight="400" fill="#868e96" xml:space="preserve">thread: software execution path</text><text x="60" y="574" font-size="13" font-weight="400" fill="#495057" xml:space="preserve">No user threads are needed here.</text><rect x="425" y="505" width="775" height="100" rx="8" fill="#f0fff0" stroke="#2f9e44" stroke-width="2"/><text x="445" y="536" font-size="14" font-weight="600" fill="#2f9e44" xml:space="preserve">KEEP NOW</text><text x="560" y="539" font-size="17" font-weight="600" fill="#1e1e1e" xml:space="preserve">snapshot -&gt; wait -&gt; recheck -&gt; return</text><text x="445" y="572" font-size="14" font-weight="400" fill="#868e96" xml:space="preserve">LEARN LATER: locks plus sleep/wakeup prevent polling and lost wakeups.</text><text x="40" y="653" font-size="13" font-weight="400" fill="#868e96" xml:space="preserve">The counter is global, but ticks0 is local to this invocation; different processes can request different delays.</text></svg>
